name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install -r app/requirements-dev.txt
      - run: python -m ruff check app
      - run: python -m ruff format --check app
      - run: npx --yes prettier@3.9.10 --check "app/static/*.{js,css,html}" "app/tests/*.mjs"
      - run: python -m unittest discover -s app/tests -v
      - run: python app/tests/validate_models.py --check
      - run: node --check app/static/app.js && node --check app/static/pages.js && node --check app/static/privacy.js && node --check app/static/api.js
      - run: node app/tests/verify_frontend.mjs
        env:
          PYTHON: python
      - run: node app/tests/audit_contrast.mjs --self-test
      - run: node app/tests/check_save_state.mjs
      - run: docker build -t ltn-smoke app
      - name: Check the packaged application
        run: |
          docker run -d --name ltn-smoke -p 127.0.0.1:18080:8080 ltn-smoke
          trap 'docker logs ltn-smoke; docker rm -f ltn-smoke' EXIT
          python app/tests/smoke_container.py
