name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r app/requirements.lock.txt
      - run: python -m unittest discover -s app/tests -v
      - run: node --check app/static/app.js && node --check app/static/pages.js && node --check app/static/privacy.js
      - run: node app/tests/verify_frontend.mjs
        env:
          PYTHON: python
      - run: node app/tests/audit_contrast.mjs --self-test
